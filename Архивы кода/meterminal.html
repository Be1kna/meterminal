.ambient:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 28%,#0d0808c9 100%)}
.room{min-height:100vh;min-height:100dvh;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:24px 22px 35px}
.rack{position:absolute;top:13%;width:14%;height:67%;max-width:185px;border:11px solid #281912;box-shadow:inset 0 0 0 4px #99633d,0 0 50px #000b;background:repeating-linear-gradient(to bottom,#3d2518 0 24px,#835034 25px 31px,#251811 32px 37px);opacity:.75}
.rack.left{left:1%}.rack.right{right:1%}
.rack:before{content:"";position:absolute;inset:5% 13%;background:repeating-linear-gradient(90deg,#111c1c 0 9px,#79604a 10px 13px,#161e1c 14px 19px);border:7px solid #453025;box-shadow:0 0 0 3px #a16f46}
.rack:after{content:"";position:absolute;left:13%;right:13%;height:20%;top:13%;border:8px solid #2a201d;box-shadow:inset 0 0 0 5px #a48b70;background:repeating-linear-gradient(0deg,#191e19 0 14px,#616d65 15px 16px,#151914 17px 18px)}
.machine{position:relative;width:min(960px,100%);isolation:isolate;filter:drop-shadow(0 22px 18px #060403cf)}
.top-beam{height:34px;background:linear-gradient(#b57d4d 0 9%,#6d4528 11% 27%,#9e683d 29% 47%,#643a21 49% 80%,#301e16 100%);border:5px solid #382116;box-shadow:inset 0 4px #d1a072,0 7px 0 #160f0c}
.shell{padding:0 22px 15px;background:repeating-linear-gradient(0deg,#0000 0 13px,#24150f36 14px 17px,#0000 18px 33px),linear-gradient(90deg,#6f4329 0,#a16c43 3%,#58321d 9%,#7c4b2d 17%,#4d2e21 52%,#825432 85%,#b27848 97%,#50301d);border-left:11px solid #4c2a1c;border-right:11px solid #4c2a1c;box-shadow:inset 5px 0 #bd8a5b,inset -5px 0 #b88959}
.header{height:62px;display:flex;align-items:center;justify-content:center;position:relative}
.mark{display:inline-flex;align-items:center;gap:6px;font-family:"Courier New",monospace;font-weight:900;font-size:clamp(18px,2.8vw,28px);letter-spacing:0;color:#f6e5c5;text-shadow:none}.mark span{display:grid;place-items:center;min-width:1.08em;height:1.08em;padding:0 .08em;line-height:1;background-image:var(--woodlit-tex);background-size:192px 192px;border:3px solid #2b180f;border-top-color:#c9925f;border-left-color:#b77e50;border-right-color:#5b341e;border-bottom-color:#5b341e;box-shadow:inset 2px 2px 0 #e3ba8a,inset -2px -2px 0 #6d4227,2px 2px 0 #21120b;color:#f8ebd1}.mark span:nth-child(2),.mark span:nth-child(4){min-width:.76em;background-image:var(--metal-tex);background-size:192px 192px}
.bolt{position:absolute;top:25px;width:12px;height:12px;border-radius:2px;background:linear-gradient(140deg,#d9c3a0,#423c34);box-shadow:0 0 0 2px #3f2b23}
.bolt:after{content:"";position:absolute;top:5px;left:1px;width:10px;height:2px;background:#32291f;transform:rotate(35deg)}.bolt.left{left:6px}.bolt.right{right:6px}
.monitor-frame{padding:14px;border:10px solid #d2b392;border-top-color:#dfcab1;border-left-color:#cdb092;border-right-color:#8d7157;border-bottom-color:#967556;box-shadow:0 0 0 8px #3f261c,0 0 0 11px #a36b44,inset 0 0 0 4px #30261f,0 12px 0 #2b211e;background:#342920}
.display-screen{height:465px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 36%,#242422 0,#151717 63%,#090c0a 98%);border:6px solid #171717;box-shadow:inset 0 0 0 1px #44443d,inset 0 0 44px #000e}
.display-screen:before{content:"";pointer-events:none;position:absolute;z-index:8;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 3px,#00000017 4px 5px);opacity:.7}
.display-screen:after{content:"";pointer-events:none;position:absolute;z-index:8;inset:0;background:linear-gradient(125deg,#ffffff12,transparent 18% 74%,#e7cbb306)}
.screen-inner{height:100%;width:100%;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0}
[hidden]{display:none!important}
#face{border:0;background:transparent;padding:0;display:block;width:min(420px,83%);line-height:0;user-select:none;touch-action:manipulation;filter:drop-shadow(0 0 10px #eee8d044)}
#face canvas{width:100%;height:auto;aspect-ratio:160/120;image-rendering:pixelated;image-rendering:crisp-edges;display:block;transition:filter .2s}
#face:active canvas{filter:brightness(1.25)}
.prompt{font-family:"Courier New","Liberation Mono",monospace;text-align:center;font-weight:900;letter-spacing:.07em;font-size:clamp(17px,2.4vw,23px);color:#f0e8cb;text-shadow:0 0 9px #d8c59477,2px 2px #080909;margin:-6px 0 18px}
.login{width:min(470px,88%);margin:0}
.entry{height:61px;display:flex;align-items:center;background:#131513;border:4px solid #d2c5a4;box-shadow:inset 0 0 0 4px #383f34,0 4px #0c0b09}
.entry input{font-family:"Courier New", "Liberation Mono",monospace;display:block;flex:1;min-width:0;width:100%;height:100%;border:0;outline:0;background:transparent;padding:6px 13px;text-align:center;color:#fff8d8;font-size:clamp(17px,2.7vw,25px);font-weight:900;letter-spacing:.02em;caret-color:#f7ecd0;-webkit-text-fill-color:#fff8d8;text-shadow:0 0 5px #ead8af88}
.entry input::placeholder{color:#9c9e87;opacity:1;-webkit-text-fill-color:#9c9e87}
.entry button{height:100%;width:53px;border:0;border-left:2px solid #a7a083;background:#323b33;color:#f4e9ce;font-size:25px;font-weight:bold}
.entry button:hover{background:#465248}
.entry button svg{display:block;width:28px;height:28px;margin:auto;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:square}
#send{width:42px;font-weight:900;font-size:24px;background:#242b24}
#send:hover{background:#394a39}
.panel-wood{margin:19px -4px 0;padding:9px 16px 18px;border:7px solid #342217;border-top-color:#b47d51;border-bottom-color:#251712;background:repeating-linear-gradient(0deg,transparent 0 14px,#2917115e 15px 17px,transparent 18px 29px),linear-gradient(110deg,#83502f,#a56b40 21%,#5c361f 50%,#91613b 78%,#704327);box-shadow:inset 0 4px #c48d55,0 8px 0 #190f0d}
.controls{padding:17px 22px;min-height:118px;display:flex;align-items:center;justify-content:space-around;gap:18px;border:6px solid #433a31;border-top-color:#9d9584;border-bottom-color:#2b2926;background:repeating-linear-gradient(90deg,#0000 0 38px,#ffffff0c 39px 40px),linear-gradient(#64635d,#44423e 46%,#363a37 100%);box-shadow:inset 0 3px #c1b6a3,inset 0 -4px #202422}
.push-buttons{display:flex;gap:14px;align-items:center}
.push{width:64px;height:60px;padding:0;border:6px solid #252625;background:#252625;position:relative;box-shadow:0 4px #161914,0 0 0 2px #6d685d}
.push span{display:block;height:100%;width:100%;border:3px solid #0005;box-shadow:inset 4px 4px #ffffff80,inset -5px -5px #0008,0 2px #0008;transition:transform .07s;image-rendering:pixelated}
.push.red span{background:#bc4d39}.push.blue span{background:#437b9f}.push.green span{background:#598e47}
.push:active span{transform:translate(2px,3px)}
.push.active{box-shadow:0 1px #161914,0 0 0 2px #d5c09b,0 0 12px #c8af8277}
.lever{width:95px;height:76px;display:grid;place-items:center;border:0;background:none;position:relative;flex-shrink:0}
.lever .socket{width:66px;height:46px;border:5px solid #202422;background:#6a716c;box-shadow:inset 0 0 0 3px #bbb9a8,0 2px #121715}
.lever .shaft{position:absolute;left:calc(50% - 8px);top:7px;width:16px;height:56px;border:3px solid #2f302c;background:linear-gradient(90deg,#514f46,#e6d8b8 35%,#6c6e66);transform:rotate(-31deg);transform-origin:50% 80%;box-shadow:2px 2px #121714;transition:transform .18s steps(3,end)}
.lever.on .shaft{transform:rotate(31deg)}
.lever .grip{position:absolute;top:-6px;left:-7px;height:17px;width:23px;background:linear-gradient(#5f4935,#2d211a);border:3px solid #b69a73;box-shadow:inset 2px 2px #d6b287}
.dial-rail{width:95px;height:95px;display:grid;place-items:center;position:relative;touch-action:none;flex-shrink:0}
.dial-rail:before{content:"";position:absolute;width:87px;height:87px;border-radius:50%;background:repeating-conic-gradient(from -145deg,#b2a997 0deg 2deg,transparent 3deg 16deg);mask:radial-gradient(transparent 0 34px,#000 36px 44px,transparent 46px)}
.dial{--rotation:0deg;width:67px;height:67px;display:grid;place-items:center;border-radius:50%;position:relative;border:6px solid #242a28;box-shadow:inset 0 0 0 3px #aaa897,0 2px 0 #101513;background:conic-gradient(#bdb6a2,#575d57,#9b9a8a,#424741,#bdb6a2);transform:rotate(var(--rotation));touch-action:none}
.dial:after{content:"";position:absolute;top:4px;left:calc(50% - 3px);width:6px;height:23px;background:#1e2622;box-shadow:0 0 0 2px #9c978c}
.base{height:23px;background:repeating-linear-gradient(90deg,#4a281b 0 20px,#6e462b 21px 39px,#3c2217 40px 57px);border-top:6px solid #24140e}


#u1{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 0 3px #eddbae42)}
.error{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 38%,#501a15 0,#230f0d 58%,#090807 100%);cursor:pointer;overflow:hidden}
.error:before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 4px,#0007 5px 6px);opacity:.55}
#errorFace{width:min(78vw,720px);height:auto;image-rendering:pixelated;filter:drop-shadow(0 0 27px #b52116);animation:screen-approach .27s steps(4,end)}
.error-word{color:#ff9a7a;font-size:clamp(62px,13vw,148px);font-weight:900;line-height:1;text-shadow:6px 6px #3b0907,0 0 28px #f13a28;letter-spacing:.09em;animation:shake .12s steps(2,end) 4}
@keyframes screen-approach{from{transform:scale(.22)}to{transform:scale(1)}}@keyframes shake{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
@media(max-width:1040px){.rack{opacity:.37}.room{padding:22px 10px}}
@media(max-width:700px){.room{align-items:flex-start;padding:8px 5px 25px}.rack{display:none}.machine{width:100%}.top-beam{height:22px;border-width:3px}.shell{padding:0 10px 10px;border-left-width:6px;border-right-width:6px}.header{height:42px}.mark{font-size:23px;gap:4px}.mark span{border-width:2px;box-shadow:inset 1px 1px 0 #e3ba8a,inset -1px -1px 0 #6d4227,1px 1px 0 #21120b}.bolt{top:17px}.monitor-frame{border-width:6px;padding:6px;box-shadow:0 0 0 5px #3f261c,0 0 0 7px #a36b44}.display-screen{height:400px;border-width:4px}.prompt{font-size:16px;margin:-7px 0 16px}.login{width:91%}.entry{height:53px;border-width:3px}.entry input{font-size:17px;padding:5px 4px}.entry button{width:42px}.entry button svg{width:23px;height:23px}.panel-wood{padding:6px 5px 11px;margin-top:13px;border-width:5px}.controls{padding:10px 7px;min-height:91px;border-width:4px;gap:7px}.push-buttons{gap:7px}.push{width:43px;height:42px;border-width:4px}.push span{border-width:2px}.lever{width:56px;height:63px}.lever .socket{width:44px;height:36px;border-width:3px}.lever .shaft{top:6px;height:47px;width:12px;left:calc(50% - 6px)}.lever .grip{width:18px;height:15px}.dial-rail{width:61px;height:61px}.dial-rail:before{width:60px;height:60px;mask:radial-gradient(transparent 0 21px,#000 23px 30px,transparent 32px)}.dial{width:47px;height:47px;border-width:4px}.dial:after{height:15px;top:2px;width:4px;left:calc(50% - 2px)}.base{height:16px}}
@media(max-width:375px){.prompt{font-size:14px}.display-screen{height:375px}.push-buttons{gap:4px}.push{width:37px;height:37px}.lever{width:47px}.dial-rail{width:52px}.dial-rail:before{width:53px;height:53px}.dial{width:43px;height:43px}.controls{gap:3px;padding:7px 3px}.entry input{font-size:15px}}
@media(prefers-reduced-motion:reduce){.error-word,#errorFace{animation:none}.lever .shaft{transition:none}}

.rack{background-image:var(--wood-tex);background-size:192px 192px;border:13px solid #2a180f;box-shadow:inset 0 0 0 5px #a36b3e,0 0 0 4px #140b07;opacity:.68}
.rack:before{background:repeating-linear-gradient(90deg,#1b1b17 0 8px,#786955 8px 13px,#151b19 13px 21px);border:8px solid #704426;box-shadow:0 0 0 3px #ac744b}
.rack:after{left:18%;right:18%;height:auto;aspect-ratio:1;border:6px solid #583620;border-top-color:#ba8b5f;box-shadow:inset 0 0 0 2px #a48b70;background:var(--metal-tex) center/100% 100% no-repeat;background-clip:padding-box;image-rendering:pixelated}
.printer-slot{width:min(78%,560px);height:clamp(14px,2.2vw,24px);margin:clamp(8px,1.4vw,15px) auto 0;border:4px solid #554e3d;border-top-color:#27251e;border-left-color:#383329;border-bottom-color:#a39778;background:linear-gradient(#080908 45%,#191c19 46% 66%,#10120f 67%);box-shadow:inset 2px 2px #000,0 2px #302016}
.machine{filter:drop-shadow(12px 22px 0 #060402b9);}
.top-beam{height:37px;border:7px solid #2c170e;border-left-color:#b27a4c;border-top-color:#c9935d;background-image:var(--woodlit-tex);background-size:192px 192px;box-shadow:inset 0 -6px 0 #4f2b1a,0 6px 0 #20130e}
.shell{padding:0 21px 15px;background-image:var(--wood-tex);background-size:192px 192px;border-left:14px solid #4a2917;border-right:14px solid #4a2917;box-shadow:inset 7px 0 #b77d50,inset -7px 0 #b17b4b,0 0 0 4px #1f120b}
.header{height:68px;border-bottom:6px solid #4f2a19;box-shadow:inset 0 7px 0 #c49461;background:linear-gradient(90deg,#4d2a1a8a 0 7px,transparent 7px calc(100% - 7px),#4d2a1a8a calc(100% - 7px))}
.mark{font-family:"Courier New",monospace;color:#f5e5c8;font-weight:900;letter-spacing:.06em;text-shadow:3px 3px #2c1b12,4px 4px #2c1b12}
.bolt{width:15px;height:15px;background:#a69b85;border:3px solid #4e473c;box-shadow:3px 3px #231f19}
.bolt:after{top:4px;left:-1px}
.monitor-frame{padding:13px;border:13px solid #d2a574;border-top-color:#eed0a2;border-left-color:#ba8551;border-right-color:#75482c;border-bottom-color:#845336;box-shadow:0 0 0 8px #3a2115,0 0 0 13px #a7774b,inset 0 0 0 5px #28190f,10px 13px #1c1009;background-image:var(--woodlit-tex);background-size:192px 192px;}
.display-screen{height:465px;border:10px solid #101211;background:radial-gradient(ellipse at 50% 37%,#242624,#111413 65%,#080a09 100%);box-shadow:inset 0 0 0 3px #444541,inset 0 0 35px #000e;}
.display-screen:before{background:repeating-linear-gradient(to bottom,transparent 0 3px,#00000029 4px 5px);opacity:.35}
#entryScreen{justify-content:center;padding:32px 18px 22px}
#face{width:min(515px,95%);max-width:100%;filter:drop-shadow(0 0 9px #fff0bd27);margin:0 auto -1px}
#face canvas{image-rendering:pixelated}
.login{width:min(600px,95%);margin:0 auto;}
.entry{height:70px;border:0;border-bottom:5px solid #a9a89a;box-shadow:inset 0 0 0 3px #2d3530,0 4px 0 #060908;background:#0d100e;display:flex;align-items:center;padding:0 12px;}
.console-prefix{font:900 34px/1 'Courier New',monospace;color:#f1e0b5;padding:0 8px 0 12px;text-shadow:2px 2px #272b26}
.entry input{font-family:"Courier New","Liberation Mono",monospace;text-align:left;font-size:clamp(20px,3vw,30px);line-height:1.1;letter-spacing:.03em;font-weight:900;color:#fff8db;-webkit-text-fill-color:#fff8db;caret-color:#f6e5b7;text-shadow:1px 1px #080908,0 0 4px #e6d8a653;padding:8px 4px;background:transparent;width:100%;min-width:0}
.entry input::placeholder{color:transparent}
.panel-wood{margin:25px -7px 0;padding:11px 15px 17px;border:10px solid #462817;border-top-color:#e0a76e;border-left-color:#ae7348;border-right-color:#452718;border-bottom-color:#26150e;background-image:var(--woodlit-tex);background-size:192px 192px;box-shadow:inset 0 5px #d99a64,0 9px 0 #21130c}
.controls{padding:17px 24px;min-height:138px;gap:19px;border:10px solid #41433d;border-top-color:#a9a69b;border-left-color:#8e8981;border-right-color:#292d29;border-bottom-color:#252923;background-image:var(--metal-tex);background-size:192px 192px;box-shadow:inset 0 5px #908e80,inset 0 -5px #272c27,7px 7px #1d1813}
.push-buttons{gap:17px;}
.push{width:71px;height:69px;background:#1c201e;border:7px solid #242a27;box-shadow:inset 0 0 0 3px #7d8179,5px 6px #202320,0 0 0 3px #77786e}
.push span{border:0;background-image:linear-gradient(135deg,#fff5 0 15%,transparent 15% 78%,#0008 78% 100%);box-shadow:inset 6px 6px #ffffff51,inset -8px -8px #0008;position:relative}
.push.red span{background-color:#c94b3b;background-image:linear-gradient(135deg,#de705d 0 16%,#c94b3b 16% 73%,#8d251c 73%)}
.push.blue span{background-color:#407fbd;background-image:linear-gradient(135deg,#7eadd8 0 16%,#407fbd 16% 73%,#235076 73%)}
.push.green span{background-color:#4d9a4a;background-image:linear-gradient(135deg,#92c174 0 16%,#4d9a4a 16% 73%,#2a6532 73%)}
.push.active{box-shadow:inset 0 0 0 3px #a7b39f,2px 3px #1a1d1a,0 0 0 3px #beb39b}
.lever{width:107px;height:91px;}
.lever .socket{width:76px;height:61px;border:7px solid #252b28;border-top-color:#a0a69a;border-left-color:#a4a497;border-right-color:#3f4540;border-bottom-color:#1d2420;background-image:var(--stone-tex);background-size:96px 96px;box-shadow:inset 0 0 0 5px #666e66,4px 6px #1c211e}
.lever .shaft{top:9px;height:66px;width:20px;left:calc(50% - 10px);border:4px solid #303531;background:linear-gradient(90deg,#706e60 0 30%,#d4ceb7 30% 67%,#5c5e52 67%);transform:rotate(-29deg);box-shadow:5px 4px #181f1c}
.lever.on .shaft{transform:rotate(29deg)}
.lever .grip{height:24px;width:28px;top:-9px;left:-8px;border:5px solid #6c472e;border-top-color:#d8aa77;border-left-color:#c68d59;border-right-color:#4a2a1a;border-bottom-color:#3a2519;background-image:var(--wood-tex);background-size:96px 96px;box-shadow:3px 4px #20140e}
.dial-rail{width:119px;height:119px;}
.dial-rail:before{content:none}
.dial-ticks{position:absolute;inset:0;pointer-events:none;}
.dial-ticks i{position:absolute;top:50%;left:50%;width:4px;height:12px;background:#d5c5a5;box-shadow:2px 1px #252925;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-48px);transform-origin:center center;}
.dial{width:78px;height:78px;border:8px solid #222a29;border-top-color:#c5c2a9;border-left-color:#95998c;border-right-color:#343f3a;border-bottom-color:#161c19;background-image:linear-gradient(135deg,#9d9f8f 0 20%,#6c756a 20% 72%,#373f37 72%);box-shadow:inset 0 0 0 5px #b7b59f,5px 6px #1b1f1b;clip-path:polygon(22% 0,78% 0,100% 22%,100% 78%,78% 100%,22% 100%,0 78%,0 22%);}
.dial:after{height:24px;width:8px;top:3px;left:calc(50% - 4px);background:#19221c;box-shadow:3px 2px #ece0bc;}
.base{height:33px;border-top:8px solid #24140c;background-image:var(--wood-tex);background-size:192px 192px;box-shadow:inset 0 5px #a66c3e}
